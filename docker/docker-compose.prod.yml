# Déploiement de production — Raspberry Pi.
#
# ⚠️ Deux points structurants issus de la revue critique (P2-8) :
#
# 1. **Stocker sur SSD USB, pas sur carte SD.** Une carte SD s'use et lâche —
#    et elle emporte le journal d'événements avec elle. Le chemin est réglable
#    par CHAMPI_DATA pour ne pas figer un montage.
# 2. **MongoDB 8 exige un OS 64 bits** (ARMv8). Un Raspberry Pi OS 32 bits ne
#    démarrera pas l'image.
services:
  mongo:
    image: mongo:8
    container_name: champi-mongo
    restart: unless-stopped
    # Le replica set n'est pas là pour la haute disponibilité : les
    # transactions l'exigent, et toute écriture « état + événement » en est une.
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27018']
    volumes:
      - ${CHAMPI_DATA:-./data}/mongo:/data/db
    healthcheck:
      test: |
        mongosh --quiet --port 27018 --eval '
          try { rs.status().ok }
          catch { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27018"}]}).ok }
        '
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: champi-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: '3000'
      CHAMPI_MONGO_URL: 'mongodb://mongo:27018/?replicaSet=rs0'
      CHAMPI_DB_NAME: 'champignon'
    volumes:
      - ${CHAMPI_DATA:-./data}/fichiers:/app/fichiers
    ports:
      # Écoute en local seulement : c'est `tailscale serve` qui expose
      # l'application au tailnet, avec son certificat TLS. Publier sur 0.0.0.0
      # exposerait l'application au réseau local sans aucune authentification.
      - '127.0.0.1:3000:3000'
