# MongoDB en replica set à un seul nœud.
# Le replica set n'est pas là pour la haute disponibilité mais parce que
# les transactions MongoDB l'exigent — et toute écriture « état courant +
# événement » est transactionnelle (docs/06, docs/22 §2.4).
services:
  mongo:
    image: mongo:8
    container_name: champi-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval '
          try { rs.status().ok }
          catch { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok }
        '
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
