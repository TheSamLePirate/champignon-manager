name: CI

# Barrière de qualité. Chaque étape correspond à un engagement de docs/22 :
# le format et le lint tiennent les règles d'architecture (cœur pur, pas
# d'exclusion de couverture), la couverture est à 100 % strict, et le score de
# mutation est ce qui empêche ce 100 % d'être une métrique vanité.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      # Les tests d'intégration tournent contre un MongoDB réel, jamais un mock
      # (docs/22 §6.1) : mocker la base ferait passer des tests qui échouent en
      # production, précisément sur les transactions et le verrou optimiste.
      - name: Démarrer MongoDB en replica set
        run: bun run db:up

      - name: Attendre que le replica set soit prêt
        run: |
          for i in $(seq 1 30); do
            if docker exec champi-mongo mongosh --quiet --port 27018 \
                 --eval 'rs.status().ok' >/dev/null 2>&1; then
              echo "Replica set prêt."; exit 0
            fi
            sleep 2
          done
          echo "Le replica set n'est pas devenu disponible."; exit 1

      - name: Format
        run: bun run format:check

      - name: Lint (zéro avertissement toléré)
        run: bun run lint

      - name: Types
        run: bun run typecheck

      - name: Tests et couverture (seuil 100 %)
        run: bun run test:coverage

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage/
          retention-days: 14

      - name: Arrêter MongoDB
        if: always()
        run: bun run db:down

  mutation:
    name: Score de mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      # Les tests d'intégration tournent contre un MongoDB réel, jamais un mock
      # (docs/22 §6.1) : mocker la base ferait passer des tests qui échouent en
      # production, précisément sur les transactions et le verrou optimiste.
      - name: Démarrer MongoDB en replica set
        run: bun run db:up

      - name: Attendre que le replica set soit prêt
        run: |
          for i in $(seq 1 30); do
            if docker exec champi-mongo mongosh --quiet --port 27018 \
                 --eval 'rs.status().ok' >/dev/null 2>&1; then
              echo "Replica set prêt."; exit 0
            fi
            sleep 2
          done
          echo "Le replica set n'est pas devenu disponible."; exit 1

      - name: Tests de mutation (rupture sous 90 %)
        run: bunx stryker run

      - name: Publier le rapport de mutation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation
          path: reports/mutation/
          retention-days: 14

      - name: Arrêter MongoDB
        if: always()
        run: bun run db:down

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer les navigateurs
        run: bunx playwright install --with-deps chromium webkit

      # Les E2E tournent contre une vraie pile : serveur Node, MongoDB en
      # replica set. C'est le seul niveau qui prouve que les couches tiennent
      # ensemble (docs/22 §6.2).
      - name: Démarrer MongoDB en replica set
        run: bun run db:up

      - name: Attendre que le replica set soit prêt
        run: |
          for i in $(seq 1 30); do
            if docker exec champi-mongo mongosh --quiet --port 27018 \
                 --eval 'rs.status().ok' >/dev/null 2>&1; then
              echo "Replica set prêt."; exit 0
            fi
            sleep 2
          done
          echo "Le replica set n'est pas devenu disponible."; exit 1

      - name: Scénarios end-to-end
        run: bun run e2e

      # L'audit de chaîne déroule une production entière contre la pile réelle,
      # puis vérifie que la traçabilité tient de bout en bout. Les E2E prouvent
      # des propriétés isolées ; celui-ci prouve qu'elles tiennent ensemble sur
      # une histoire complète.
      - name: Audit de chaîne complète
        run: |
          CHAMPI_DB_NAME=champignon_audit PORT=3200 node packages/api/dist/server.mjs &
          for i in $(seq 1 30); do
            curl -sf -m 2 http://127.0.0.1:3200/api/health > /dev/null && break
            sleep 2
          done
          node scripts/audit-chaine.mjs --url http://127.0.0.1:3200

      - name: Publier l'audit de chaîne
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-chaine
          path: reports/audit-chaine/
          retention-days: 90

      - name: Publier le rapport E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: reports/e2e/
          retention-days: 14

      - name: Publier les traces d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

      - name: Arrêter MongoDB
        if: always()
        run: bun run db:down

  # Le rapport d'audit **agrège**, il ne recalcule rien : il lit les résultats
  # produits par les trois travaux précédents. C'est ce qui garantit qu'il ne
  # peut pas annoncer mieux que ce qui a réellement été mesuré.
  audit:
    name: Rapport d'audit
    runs-on: ubuntu-latest
    needs: [qualite, mutation, e2e]
    # `always()` : un audit n'a d'intérêt que s'il est produit aussi — et
    # surtout — quand quelque chose a échoué. Il rendra alors un verdict non
    # conforme, et le travail échouera à son tour.
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Récupérer les résultats de couverture
        uses: actions/download-artifact@v4
        # Un travail amont peut avoir échoué avant de publier : le rapport doit
        # alors se construire quand même et déclarer la section manquante.
        continue-on-error: true
        with:
          name: couverture
          path: coverage/

      - name: Récupérer les résultats de mutation
        uses: actions/download-artifact@v4
        # Un travail amont peut avoir échoué avant de publier : le rapport doit
        # alors se construire quand même et déclarer la section manquante.
        continue-on-error: true
        with:
          name: mutation
          path: reports/mutation/

      - name: Récupérer les résultats end-to-end
        uses: actions/download-artifact@v4
        # Un travail amont peut avoir échoué avant de publier : le rapport doit
        # alors se construire quand même et déclarer la section manquante.
        continue-on-error: true
        with:
          name: e2e
          path: reports/e2e/

      - name: Construire le rapport
        run: node scripts/rapport-audit.mjs

      - name: Publier le rapport d'audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit
          path: reports/audit/
          retention-days: 90
