name: CI

# Barrière de qualité. Chaque étape correspond à un engagement de docs/22 :
# le format et le lint tiennent les règles d'architecture (cœur pur, pas
# d'exclusion de couverture), la couverture est à 100 % strict, et le score de
# mutation est ce qui empêche ce 100 % d'être une métrique vanité.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      # Les tests d'intégration tournent contre un MongoDB réel, jamais un mock
      # (docs/22 §6.1) : mocker la base ferait passer des tests qui échouent en
      # production, précisément sur les transactions et le verrou optimiste.
      - name: Démarrer MongoDB en replica set
        run: bun run db:up

      - name: Attendre que le replica set soit prêt
        run: |
          for i in $(seq 1 30); do
            if docker exec champi-mongo mongosh --quiet --port 27018 \
                 --eval 'rs.status().ok' >/dev/null 2>&1; then
              echo "Replica set prêt."; exit 0
            fi
            sleep 2
          done
          echo "Le replica set n'est pas devenu disponible."; exit 1

      - name: Format
        run: bun run format:check

      - name: Lint (zéro avertissement toléré)
        run: bun run lint

      - name: Types
        run: bun run typecheck

      - name: Tests et couverture (seuil 100 %)
        run: bun run test:coverage

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage/
          retention-days: 14

      - name: Arrêter MongoDB
        if: always()
        run: bun run db:down

  mutation:
    name: Score de mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      # Les tests d'intégration tournent contre un MongoDB réel, jamais un mock
      # (docs/22 §6.1) : mocker la base ferait passer des tests qui échouent en
      # production, précisément sur les transactions et le verrou optimiste.
      - name: Démarrer MongoDB en replica set
        run: bun run db:up

      - name: Attendre que le replica set soit prêt
        run: |
          for i in $(seq 1 30); do
            if docker exec champi-mongo mongosh --quiet --port 27018 \
                 --eval 'rs.status().ok' >/dev/null 2>&1; then
              echo "Replica set prêt."; exit 0
            fi
            sleep 2
          done
          echo "Le replica set n'est pas devenu disponible."; exit 1

      - name: Tests de mutation (rupture sous 90 %)
        run: bunx stryker run

      - name: Publier le rapport de mutation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation
          path: reports/mutation/
          retention-days: 14

      - name: Arrêter MongoDB
        if: always()
        run: bun run db:down

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer les navigateurs
        run: bunx playwright install --with-deps chromium webkit

      # Les E2E tournent contre une vraie pile : serveur Node, MongoDB en
      # replica set. C'est le seul niveau qui prouve que les couches tiennent
      # ensemble (docs/22 §6.2).
      - name: Démarrer MongoDB en replica set
        run: bun run db:up

      - name: Attendre que le replica set soit prêt
        run: |
          for i in $(seq 1 30); do
            if docker exec champi-mongo mongosh --quiet --port 27018 \
                 --eval 'rs.status().ok' >/dev/null 2>&1; then
              echo "Replica set prêt."; exit 0
            fi
            sleep 2
          done
          echo "Le replica set n'est pas devenu disponible."; exit 1

      - name: Scénarios end-to-end
        run: bun run e2e

      - name: Publier le rapport E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: reports/e2e/
          retention-days: 14

      - name: Publier les traces d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

      - name: Arrêter MongoDB
        if: always()
        run: bun run db:down
